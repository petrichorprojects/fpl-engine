[project]
name = "fpl-engine"
version = "0.1.0"
description = "World-class Fantasy Premier League analytics engine"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pulp>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["fpl_engine*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
